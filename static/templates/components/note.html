<li class="card">
    <h3>{title}</h3>
    <p>{details}</p>
    <a name="delete_button" href="/delete/{id}" title="apagar">🗑</a>
    <a name="edit_button" href="/update/{id}" title="editar">✎</a>
    <a name="favorite_button" href="/favorite/{id}" class="{favorite}" title="{favorite_title}">{favorite_text}</a>
</li>
